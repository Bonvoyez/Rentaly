# =============================================================================
# Rentaly 백엔드 로컬 개발 환경 (A + B 통합본)
# =============================================================================

services:
  db:
    image: postgres:16
    container_name: rentaly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: rentaly-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

  api:
    build: ./backend
    container_name: rentaly-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-jwt-key-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - images:/app/storage/images
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  pgdata:
  mqttdata:
  images: