# 배포 서버 Nginx 설정 (/etc/nginx/sites-available/rentaly)
# 인증서: certbot --nginx -d rentaly.duckdns.org

server {
    listen 80;
    server_name rentaly.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rentaly.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/rentaly.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentaly.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
