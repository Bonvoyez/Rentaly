# =============================================================================
# Eclipse Mosquitto 설정 (로컬 개발용)
# =============================================================================

# 1) 엣지(라즈베리파이, mock_edge.py)가 접속하는 일반 MQTT 포트
listener 1883
protocol mqtt

# 2) 검사대 UI(브라우저)가 접속하는 WebSocket 포트
listener 9001
protocol websockets

# 개발 단계에서는 인증 없이 허용. (TODO: 배포 전 계정/ACL 적용)
allow_anonymous true

# 메시지 저장 위치 (컨테이너 재시작해도 유지)
persistence true
persistence_location /mosquitto/data/

# 로그는 docker logs로 바로 보이게
log_dest stdout
